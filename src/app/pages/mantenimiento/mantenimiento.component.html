<div class="background-container" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<main class="container">
  <div class="glass-card" role="status" aria-live="polite">
    <div class="icon-wrapper" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0a2.12 2.12 0 0 1 0-3L12 9" /><path d="M17.64 15 22 10.64" /><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6A5.56 5.56 0 0 0 12.07 2.96H11.2l-1.9 1.9c-.37.37-.58.88-.58 1.41v1.5l1.62 1.62" /></svg>
    </div>
    <h1 class="title">Rifas Luxury RD</h1>
    <h2 class="subtitle">Mantenimiento temporal</h2>
    <p class="description">{{ message || defaultMessage }}</p>
    <div class="progress-container" aria-hidden="true"><div class="progress-bar"></div></div>

    @if (loading) {
      <p class="hint">Verificando estado…</p>
    } @else if (!blocked) {
      <p class="ok">¡Listo! Las compras ya están habilitadas.</p>
      <a routerLink="/" class="btn">Volver al inicio</a>
    } @else {
      <button type="button" class="btn" (click)="refresh()">Reintentar</button>
    }
    <a routerLink="/verificar" class="link">Ir al verificador</a>

    <div class="footer"><p>¡Gracias por tu paciencia!</p></div>
  </div>
</main>
